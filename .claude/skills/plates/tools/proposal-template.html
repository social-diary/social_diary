<title>Social Diary · proposal</title>
<!-- Proposal template (the plates skill, §6): copy to .claude/ui-proposal/<name>-mockup.html, write only the DESIGN block.
     The library is proposal-kit.js beside this file (never edited for a proposal). #flat opens with flat paper. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Neuton:ital@1&display=swap" rel="stylesheet">
<script>
// The kit: from .claude/ui-proposal/ (where copies live), else beside the template (tools/).
(function load(src) { const s = document.createElement("script"); s.src = src[0];
  s.onerror = () => src.length > 1 ? load(src.slice(1)) : document.documentElement.insertAdjacentHTML("beforeend",
    "<p style='color:#d49a8c;font:13px sans-serif;padding:20px'>proposal-kit.js not found (.claude/skills/plates/tools/)</p>");
  document.head.appendChild(s); })(["../skills/plates/tools/proposal-kit.js", "proposal-kit.js"]);
</script>
</head>
<body>
<script type="text/x-design" id="design">
/* ================================================================ DESIGN (the only part a proposal edits; runs after the kit)
  proposal({ name, feature, date })    name keys the saved review: use the mockup's name.
  variant({ id: "A", label, sizes: { XL, L, M, S }, mark })    exactly three: A, B, C.
    sizes: each (box, ctx) => K.slip(…) | K.pair(…) | { w, h, html } | null (null: does not go in this box).
      Shown at XL 220 · L 176 · M 142 · S 122 px (bands: XL ≥190, L 150–189, M 122–149, S one line in the hand at 14 px).
      Leave out a size the variant does not have.
    box = { w, band }   ctx = { K, seed, size, flat }   pass seed on to K.slip.
    mark: K => svg about 0,0 (the paper halo is drawn for it); shown at 2×.
  K: hand(t, px) · friz(t, px) (Friz's widths: Marcellus × 1.07) · lh(font, px) · base(top, font, px) · wrap(t, font, px, w, most)
     text(x, top, t, { font: "hand"|"friz", size, colour, anchor, alpha }) · line(x1, y1, x2, y2, { width, colour, alpha })
     slip({ w, h, seed, svg, html, paper: "strip"|"tag", tape: "top"|"corner"|"left"|"none", turn }) · pair(a, b, dx, dy)
     pen(points, o) · underline(x0, x1, base, seed) · strike(x0, mid, w, px, seed) · tally(n, x, y) · tallyW(n)
     icon(x, y, px, { count }) · silhouette(x, y, w, h) · levelTag(x, y, t) · bar(x, y, w, pct)
     mark(kind, x, y): person death close star luck pouch campfire door pin dot · rng(seed) · C (inks) · STRIP_PAD
  The family's rule: printed Friz = what the tables said, the hand = what happened, graphite (C.graphite) = what the
  diary worked out. Nothing under 11 px. It must also work flat (the bar's "flat paper": no turn, no shadow).
*/
proposal({ name: "example", feature: "Duels (example)", date: "2026-10-15" });

/* ---- EXAMPLE: replace from here to "EXAMPLE end" (a duel won, three ways) ---- */
const P = K.STRIP_PAD, swords = K => K.line(-4.5, 4.5, 4.5, -4.5, { width: 1.8 }) + K.line(-4.5, -4.5, 4.5, 4.5, { width: 1.8 });
// A and B: the hand says what happened, Friz what the tables said; B underlines "Beat".
const strip = under => (box, { K, seed }) => {
  const room = box.w - P[0] - P[2], hs = K.hand("Beat Brannoc", 16) <= room ? 16 : 14, top = P[1] + K.lh("hand", hs) + 1;
  const lines = K.wrap("in a duel, two minutes of it", "friz", 11, room, 2);
  let svg = K.text(P[0], P[1], "Beat Brannoc", { size: hs }) + lines.map((l, i) => K.text(P[0], top + i * 13, l, { font: "friz" })).join("");
  if (under) svg += K.underline(P[0], P[0] + K.hand("Beat", hs), K.base(P[1], "hand", hs), seed);
  return K.slip({ w: box.w, h: top + lines.length * 13 + P[3], seed, svg });
};
const oneLine = (box, { K, seed }) => { const t = "beat Brannoc in a duel", w = Math.ceil(K.hand(t, 14)) + P[0] + P[2];
  return w > box.w ? null : K.slip({ w, h: 26, seed, tape: "corner", svg: K.text(P[0], 4, t, { size: 14 }) }); };
// C: a printed card (graphite: the time the diary worked out), the hand's verdict on a tag over it.
const card = (box, { K, seed }) => { const tw = Math.ceil(K.hand("you won", 14)) + 18;
  return K.pair(K.slip({ w: box.w - 16, h: 42, seed, svg: K.text(P[0], P[1], "Duel · Brannoc, Lv 14", { font: "friz" })
    + K.text(P[0], P[1] + 16, "2 min 10 s", { font: "friz", colour: K.C.graphite }) }),
    K.slip({ w: tw, h: 26, seed: seed + ":tag", paper: "tag", tape: "left", svg: K.text(9, 4, "you won", { size: 14 }) }), box.w - tw, 28); };
variant({ id: "A", label: "Strip", mark: swords, sizes: { XL: strip(false), L: strip(false), M: strip(false), S: oneLine } });
variant({ id: "B", label: "Strip, Beat underlined", mark: swords, sizes: { XL: strip(true), L: strip(true), M: strip(true) } });
variant({ id: "C", label: "Card and tag", mark: swords, sizes: { XL: card, L: card, M: card } });
/* ---- EXAMPLE end ---- */
</script>
</body>
